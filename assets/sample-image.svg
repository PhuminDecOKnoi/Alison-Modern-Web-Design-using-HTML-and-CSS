<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">HTML and CSS learning illustration</title>
  <desc id="desc">A simple educational illustration showing HTML structure and CSS styling cards.</desc>
  <rect width="840" height="480" fill="#f5f7fb"/>
  <rect x="60" y="70" width="320" height="340" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="3"/>
  <rect x="460" y="70" width="320" height="340" rx="24" fill="#ffffff" stroke="#d9e2ec" stroke-width="3"/>
  <text x="110" y="135" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0f4c81">HTML</text>
  <text x="510" y="135" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0f4c81">CSS</text>
  <text x="110" y="195" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2937">&lt;header&gt;</text>
  <text x="110" y="235" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2937">&lt;main&gt;</text>
  <text x="110" y="275" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2937">&lt;section&gt;</text>
  <text x="110" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#1f2937">&lt;footer&gt;</text>
  <circle cx="540" cy="220" r="42" fill="#f59e0b"/>
  <rect x="600" y="190" width="120" height="60" rx="16" fill="#0f4c81"/>
  <rect x="520" y="300" width="210" height="36" rx="18" fill="#d9e2ec"/>
  <text x="250" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7280">Structure</text>
  <text x="620" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#6b7280">Presentation</text>
</svg>
